org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# The host is aarch64; AGP would otherwise download and exec the x86_64 aapt2
# from Maven. Point it at the qemu-emulated SDK binary instead.
android.aapt2FromMavenOverride=/opt/mobile-shims/aapt2
